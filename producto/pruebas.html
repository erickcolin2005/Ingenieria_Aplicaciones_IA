<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criterios de aceptación — Reservas del laboratorio</title>
<style>
  :root { --tinta:#16202c; --suave:#5b6b7d; --linea:#d6dee7; --verde:#14603c; --rojo:#b4232b; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px; background:#f6f8fa; color:var(--tinta);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  h1 { font-size:21px; margin:0 0 2px; }
  .sub { color:var(--suave); font-size:13px; margin:0 0 18px; }
  #resumen {
    font-size:20px; font-weight:700; padding:14px 16px; border-radius:8px;
    border:1px solid var(--linea); background:#fff; margin-bottom:16px;
  }
  #resumen.todo { color:var(--verde); border-color:#bfe3ce; background:#eef8f2; }
  #resumen.falla { color:var(--rojo); border-color:#f0c7c7; background:#fdf0f0; }
  ul { list-style:none; margin:0; padding:0; }
  li {
    background:#fff; border:1px solid var(--linea); border-radius:6px;
    padding:9px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:flex-start;
  }
  .marca { font-weight:700; font-size:12px; letter-spacing:.04em; min-width:52px; }
  .pasa .marca { color:var(--verde); }
  .falla { border-color:#f0c7c7; background:#fdf0f0; }
  .falla .marca { color:var(--rojo); }
  .ca { font-size:11px; font-weight:600; color:#fff; background:#5b6b7d;
        border-radius:4px; padding:2px 6px; min-width:54px; text-align:center; }
  .detalle { display:block; margin-top:4px; font-size:13px; color:var(--rojo); }
  .pie { margin-top:20px; font-size:12px; color:var(--suave); }
</style>
</head>
<body>

<h1>Criterios de aceptación</h1>
<p class="sub">
  Los criterios marcados con ✅ en <code>docs/SPEC.md §6</code>, ejecutados contra
  <code>reglas.js</code> con un reloj fijo (17 sep 2026, 9:30 a. m.).
</p>

<div id="resumen">Ejecutando…</div>
<ul id="lista"></ul>

<p class="pie">Lo mismo se corre en terminal con <code>node producto/pruebas.js</code>.</p>

<script src="reglas.js"></script>
<script src="pruebas.js"></script>
<script>
(function () {
  var r = window.PRUEBAS.ejecutar();
  var resumen = document.getElementById('resumen');
  var lista = document.getElementById('lista');

  resumen.textContent = r.pasan + ' / ' + r.total + ' criterios pasan' +
    (r.fallan ? ' · ' + r.fallan + ' fallan' : '');
  resumen.className = r.fallan ? 'falla' : 'todo';

  r.resultados.forEach(function (x) {
    var li = document.createElement('li');
    li.className = x.ok ? 'pasa' : 'falla';

    var marca = document.createElement('span');
    marca.className = 'marca';
    marca.textContent = x.ok ? 'PASA' : 'FALLA';

    var ca = document.createElement('span');
    ca.className = 'ca';
    ca.textContent = x.ca;

    var texto = document.createElement('span');
    texto.textContent = x.titulo;
    if (!x.ok) {
      var d = document.createElement('span');
      d.className = 'detalle';
      d.textContent = x.detalle;
      texto.appendChild(d);
    }

    li.appendChild(marca); li.appendChild(ca); li.appendChild(texto);
    lista.appendChild(li);
  });
})();
</script>
</body>
</html>
